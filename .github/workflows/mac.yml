# Runs the Mac version's tests whenever its code changes
name: Mac

on:
  push:
    paths: ["mac/**", ".github/workflows/mac.yml"]
  pull_request:
    paths: ["mac/**", ".github/workflows/mac.yml"]

jobs:
  test:
    # Some packages IpBump builds with need Swift 6.2 or later, which comes with Xcode 26
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test --package-path mac
